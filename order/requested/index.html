<style>
  :root{
    --bone:#EFEAE0; --bone-deep:#E4DDD0; --ink:#1A1915; --ink-soft:#403D34;
    --oxide:#8B3A2E; --oxide-deep:#742F25; --sage:#8E9582;
    --line:rgba(26,25,21,.14);
    --serif:"Fraunces",Georgia,serif;
    --sans:"Instrument Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    color-scheme:light only;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bone);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px}
  .mark{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-0.01em;margin-bottom:40px}
  .mark a{color:var(--ink);text-decoration:none}
  .seal{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oxide);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,48px);line-height:1.08;letter-spacing:-0.015em;margin:0 0 18px;max-width:20ch}
  p{max-width:46ch;line-height:1.65;color:var(--ink-soft);margin:0 0 14px;font-size:16px}
  .card{margin-top:30px;padding:26px 28px;border:1px solid var(--line);border-radius:4px;max-width:44ch;text-align:left;background:var(--bone-deep);width:100%}
  .card .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .card .row:last-child{border-bottom:0}
  .card .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
  .card .v{color:var(--ink);text-align:right;font-weight:500}
  .next{margin-top:26px;text-align:left;max-width:44ch;width:100%}
  .next h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:0 0 12px}
  .next ol{margin:0;padding-left:18px;color:var(--ink-soft);line-height:1.6;font-size:14.5px}
  .next li{margin-bottom:7px}
  .btn{display:inline-block;margin-top:34px;background:var(--oxide);color:var(--bone);text-decoration:none;padding:14px 30px;border-radius:2px;font-size:15px;font-weight:500}
  .btn:hover{background:var(--oxide-deep)}
  .foot{margin-top:44px;font-family:var(--mono);font-size:11px;color:var(--sage)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><a href="/">bio.</a></div>
    <div class="seal">Enquiry received</div>
    <h1>Thank you<span id="firstname"></span>. We'll connect you with a clinic.</h1>
    <p>We've received your enquiry and sent a confirmation to your email. We'll introduce you to your nearest bio. partner clinic shortly.</p>
    <a class="btn" href="/">Back to bio.</a>
    <div class="foot">bio. — getbiodental.co.uk · hello@getbiodental.co.uk</div>
  </div>
<script>
(function(){ var n=new URLSearchParams(location.search).get('name'); if(n) document.getElementById('firstname').textContent=', '+n;
 try{ if(window.gtag) gtag('event','generate_lead',{lead_type:'clinic_enquiry'}); }catch(_){} })();
</script>
</body>
</html>
